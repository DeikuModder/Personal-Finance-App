services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fintrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fintrack
    ports:
      - "5432:5432"
    volumes:
      - fintrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintrack -d fintrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://fintrack:${POSTGRES_PASSWORD}@db:5432/fintrack
      CORS_ORIGIN: ${CORS_ORIGIN}
      PORT: 3000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-gabrieltc555@gmail.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      AUTH_ACCESS_TTL_MINUTES: ${AUTH_ACCESS_TTL_MINUTES:-15}
      AUTH_ABSOLUTE_TTL_DAYS: ${AUTH_ABSOLUTE_TTL_DAYS:-30}
      AUTH_REFRESH_GC_DAYS: ${AUTH_REFRESH_GC_DAYS:-7}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-FinTrack <no-reply@fintrack.app>}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "4200:4200"
    restart: unless-stopped
    depends_on:
      - api

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel run --protocol http2
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - app

volumes:
  fintrack_pgdata:
