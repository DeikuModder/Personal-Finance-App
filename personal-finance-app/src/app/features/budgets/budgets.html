<div class="budgets-page">
  <app-page-header title="Budgets" [fabIcon]="showForm() ? 'close' : 'add'" (fabClicked)="showForm.set(!showForm())" />

  <span class="month-label">{{ currentMonth }}</span>

  <app-section-help
    title="Budgets — plan your spending"
    [description]="'Budgets let you set a monthly spending limit per category (for example groceries, transport or entertainment). The app automatically compares what you have spent on those categories from your Expense transactions and shows a progress bar, so you always know whether you are on track or over.'"
    [howTo]="[
      'Tap the + button to add a budget for the current month: pick a category.',
      'Once created, add products to the budget by typing a name and price next to the Add button. The total budget is the sum of all product prices.',
      'The totals card shows your combined budget and how much you have spent so far this month.',
      'Each budget shows a progress bar — it turns red as you get close to or exceed the limit.',
      'Budgets are per month. Add budgets again next month; delete any you no longer need with the trash icon.'
    ]"
  />

  <div class="total-card">
    <div class="total-row">
      <span class="total-label">Total Budget</span>
      <span class="total-value">{{ getTotalBudget() | currencyFormat }}</span>
    </div>
    <div class="total-row">
      <span class="total-label">Spent</span>
      <span class="total-value warn">{{ getTotalSpent() | currencyFormat }}</span>
    </div>
    <div class="total-row">
      <span class="total-label">Remaining</span>
      <span class="total-value">{{ getTotalRemaining() | currencyFormat }}</span>
    </div>
    @if (getTotalBudget() > 0) {
      <mat-progress-bar
        mode="determinate"
        [value]="getTotalSpent() / getTotalBudget() * 100"
        class="total-progress"
      />
    }
  </div>

  @if (showForm()) {
    <div class="form-card">
      <app-budget-form (saved)="addBudget($event)" (cancelled)="onCancel()" />
    </div>
  }

  <app-budget-list [budgets]="budgets()" (deleted)="onDelete($event)" (itemAdded)="onItemAdded($event)" (itemDeleted)="onItemDeleted($event)" />
</div>
