<div class="day-stripe">
  @for (day of days; track $index) {
    <div
      class="day-chip"
      [class.dimmed]="!day.marked"
      [class.over]="day.over"
      [title]="formatDate(day)"
    >
      <span class="day-num">{{ day.day }}</span>
      <span class="day-dot"></span>
    </div>
  }
</div>
