<div class="form-container">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Monthly Income</mat-label>
    <input
      matInput
      type="number"
      [ngModel]="monthlyIncome()"
      (ngModelChange)="monthlyIncome.set($event)"
      placeholder="0.00"
      min="0"
      step="0.01"
    />
    <span matPrefix>$&nbsp;</span>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Weekly Maximum Outcome</mat-label>
    <input
      matInput
      type="number"
      [ngModel]="weeklyMax()"
      (ngModelChange)="weeklyMax.set($event)"
      placeholder="0.00"
      min="0"
      step="0.01"
    />
    <span matPrefix>$&nbsp;</span>
  </mat-form-field>

  <p class="hint">
    A month splits into ~4 weeks plus 3 extra days. If you spend over a week's cap, the next
    week's cap shrinks by the same amount. Save money and the next week gets a bonus!
  </p>

  <div class="form-actions">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button
      mat-flat-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="monthlyIncome() <= 0 || weeklyMax() <= 0"
    >
      <mat-icon>flag</mat-icon>
      Start Challenge
    </button>
  </div>
</div>
