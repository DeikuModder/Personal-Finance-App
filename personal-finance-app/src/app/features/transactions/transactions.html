<div class="transactions-page">
  <div class="page-header">
    <h1>Transactions</h1>
    <button mat-fab class="fab" (click)="goToAdd()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <app-section-help
    title="Transactions — what this is"
    [description]="'This is your full activity ledger. Every income payment and expense you add is recorded here, dated and tagged with a category and an account. It is the single source of truth that powers the Home dashboard, Budgets, Money Quest, and your net worth calculation.'"
    [howTo]="[
      'Tap the + button to add a new income or expense (or use the + button in the bottom nav).',
      'Use the Type, Category and Period filters at the top to narrow the list, then Clear filters to reset.',
      'Tap the trash icon on any entry to delete it. Deleting here also updates the dashboard, budgets and challenge.',
      'Everything is saved automatically and synced to your account, so it stays in sync across your devices.'
    ]"
  />

  <div class="filters">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Type</mat-label>
      <mat-select [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event); applyFilters()">
        <mat-option value="all">All</mat-option>
        <mat-option value="income">Income</mat-option>
        <mat-option value="expense">Expense</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Category</mat-label>
      <mat-select [ngModel]="categoryFilter()" (ngModelChange)="categoryFilter.set($event); applyFilters()">
        <mat-option value="all">All</mat-option>
        @for (cat of categories; track cat.value) {
          <mat-option [value]="cat.value">{{ cat.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Period</mat-label>
      <mat-select [ngModel]="monthFilter()" (ngModelChange)="monthFilter.set($event); applyFilters()">
        <mat-option value="all">All time</mat-option>
        <mat-option value="current">This month</mat-option>
        <mat-option value="last">Last month</mat-option>
        <mat-option value="thisYear">This year</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  @if (hasFilters) {
    <button mat-button class="clear-filters" (click)="clearFilters()">
      Clear filters
    </button>
  }

  <app-transaction-list [transactions]="filteredTransactions()" (deleted)="onDelete($event)" />
</div>
