<div class="transactions-page">
  <div class="page-header">
    <h1>Transactions</h1>
    <button mat-fab class="fab" (click)="goToAdd()">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <app-section-help
    title="Transactions — what this is"
    [description]="'This is your full activity ledger. Every income payment, expense and transfer between your accounts is recorded here, dated and tagged with an account. It is the single source of truth that powers the Home dashboard, Budgets, Money Quest, and your net worth calculation.'"
    [howTo]="[
      'Tap the + button to add a new income, expense or transfer (or use the + button in the bottom nav).',
      'Use the Type, Category and Period filters at the top to narrow the list, then Clear filters to reset.',
      'Tap the pencil icon to edit an entry (amount, date, category or account), or the trash icon to delete it. Editing and deleting here also update the linked account balance, dashboard, budgets and challenge.',
      'Transfers move money between your own accounts — they never appear as income or spending, so they won\'t affect budgets or the challenge.'
    ]"
  />

  <div class="filters">
    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Type</mat-label>
      <mat-select [ngModel]="typeFilter()" (ngModelChange)="typeFilter.set($event); applyFilters()">
        <mat-option value="all">All</mat-option>
        <mat-option value="income">Income</mat-option>
        <mat-option value="expense">Expense</mat-option>
        <mat-option value="transfer">Transfer</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Category</mat-label>
      <mat-select [ngModel]="categoryFilter()" (ngModelChange)="categoryFilter.set($event); applyFilters()">
        <mat-option value="all">All</mat-option>
        @for (cat of categories; track cat.value) {
          <mat-option [value]="cat.value">{{ cat.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filter-field">
      <mat-label>Period</mat-label>
      <mat-select [ngModel]="monthFilter()" (ngModelChange)="monthFilter.set($event); applyFilters()">
        <mat-option value="all">All time</mat-option>
        <mat-option value="current">This month</mat-option>
        <mat-option value="last">Last month</mat-option>
        <mat-option value="thisYear">This year</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  @if (hasFilters) {
    <button mat-button class="clear-filters" (click)="clearFilters()">
      Clear filters
    </button>
  }

  <app-transaction-list [transactions]="filteredTransactions()" (deleted)="onDelete($event)" (edited)="onEdit($event)" />
</div>
