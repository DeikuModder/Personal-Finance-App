<div class="dashboard">
  <div class="dashboard-header">
    <div class="header-title-row">
      <h1>FinTrack</h1>
      <a routerLink="/settings" mat-icon-button aria-label="Settings" class="settings-btn">
        <mat-icon>settings</mat-icon>
      </a>
    </div>
    <div class="period-nav">
      <button mat-icon-button class="nav-btn" (click)="prevMonth()" aria-label="Previous month">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span class="month-label">{{ periodLabel }}</span>
      <button mat-icon-button class="nav-btn" (click)="nextMonth()" aria-label="Next month">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  <app-section-help
    title="Home — your money at a glance"
    [description]="'The Home screen summarizes your finances for the month you have selected. It pulls directly from your Transactions, Accounts and Investments, so the numbers always stay in sync with what you have recorded.'"
    [howTo]="[
      'Use the arrow buttons next to the month name to view past (or future) months.',
      'The top cards show your Balance, Income and Expenses for that month.',
      'Net Worth compares your account totals against your investments on the date shown.',
      'Spending by category and the monthly trend chart break down where your money goes.',
      'Recent transactions show your latest activity — tap the gear to reach Settings.'
    ]"
  />

  <div class="summary-row">
    <app-summary-cards
      [balance]="balance()"
      [income]="income()"
      [expenses]="expenses()"
    />

    <app-net-worth-card
      [accountsTotal]="accountsTotal()"
      [investmentsValue]="investmentsValue()"
      [investmentsIncome]="investmentsIncome()"
    />
  </div>

  <div class="charts-row">
    <app-spending-by-category [transactions]="allTransactions()" />
    <app-monthly-trend [transactions]="allTransactions()" />
  </div>

  <app-recent-transactions [transactions]="recentTransactions()" />
</div>
