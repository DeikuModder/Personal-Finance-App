<div class="wishlist-page">
  <app-page-header title="Wishlist" (fabClicked)="startAdd()" />

  <div class="privacy-row">
    <app-privacy-toggle section="wishlist" />
  </div>

  @if (saveError()) {
    <app-error-banner [message]="saveError()" (dismissed)="saveError.set(null)" />
  }

  <app-section-help
    title="Wishlist — things you could buy today"
    description="A simple memory list of things you want. No budgets, no goals: just remember what those nice-to-haves are, with a picture and a price tag."
    [howTo]="[
      'Tap the + to add something: give it a name and, optionally, how much it costs and a picture.',
      'When you actually get the item, tap “Achieved” to mark it as yours — it moves to the bottom with its date.',
      'Edit or remove any item anytime with the pencil and trash icons.'
    ]"
  />

  @if (showForm()) {
    <div class="form-card">
      <app-wishlist-form
        [editing]="editing()"
        [uploading]="uploading()"
        [uploadProgress]="uploadProgress()"
        (saved)="onSaved($event)"
        (cancelled)="onCancel()"
      />
    </div>
  }

  <app-wishlist-list
    [items]="items()"
    (deleted)="onDelete($event)"
    (edited)="startEdit($event)"
    (achieved)="onAchieved($event)"
  />
</div>
