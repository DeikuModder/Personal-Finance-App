<div class="setup-container">
  <div class="setup-header">
    <mat-icon class="setup-icon">security</mat-icon>
    <h2>Set Up PIN</h2>
    <p>{{ step() === 'enter' ? 'Choose a 6-digit PIN to secure your app' : 'Confirm your PIN' }}</p>
  </div>

  @if (error()) {
    <div class="error-message">
      PINs don't match. Try again.
    </div>
  }

  <app-pin-entry (pinComplete)="onPinComplete($event)" />

  <button mat-button class="skip-btn" (click)="onSkip()">
    Skip for now
  </button>
</div>
