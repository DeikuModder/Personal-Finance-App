<div class="form-container">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Creditor</mat-label>
    <input
      matInput
      [ngModel]="creditor()"
      (ngModelChange)="creditor.set($event)"
      [maxlength]="60"
      placeholder="e.g. Chase Bank, friend, car loan"
    />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Description (optional)</mat-label>
    <input
      matInput
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
      [maxlength]="120"
      placeholder="e.g. Credit card balance"
    />
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="amount-field">
      <mat-label>Amount owed</mat-label>
      <span matPrefix>$&nbsp;</span>
      <input matInput type="number" [ngModel]="amountOwed()" (ngModelChange)="amountOwed.set($event)" min="0" step="0.01" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="half-field">
      <mat-label>Interest rate</mat-label>
      <input matInput type="number" [ngModel]="interestRate()" (ngModelChange)="interestRate.set($event)" min="0" step="0.01" />
      <span matSuffix>%</span>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Minimum payment (optional)</mat-label>
    <span matPrefix>$&nbsp;</span>
    <input matInput type="number" [ngModel]="minimumPayment()" (ngModelChange)="minimumPayment.set($event)" min="0" step="0.01" />
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="half-field">
      <mat-label>Due date</mat-label>
      <input matInput [matDatepicker]="duePicker" [ngModel]="dueDate()" (ngModelChange)="dueDate.set($event)" />
      <mat-datepicker-toggle matIconSuffix [for]="duePicker"></mat-datepicker-toggle>
      <mat-datepicker #duePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="half-field">
      <mat-label>Remind me</mat-label>
      <input matInput [matDatepicker]="remindPicker" [ngModel]="remindOn()" (ngModelChange)="remindOn.set($event)" />
      <mat-datepicker-toggle matIconSuffix [for]="remindPicker"></mat-datepicker-toggle>
      <mat-datepicker #remindPicker></mat-datepicker>
    </mat-form-field>
  </div>

  @if (editing()) {
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Status</mat-label>
      <mat-select [ngModel]="status()" (ngModelChange)="status.set($event)">
        <mat-option value="active">Active</mat-option>
        <mat-option value="paid">Paid</mat-option>
      </mat-select>
    </mat-form-field>
  }

  <div class="form-actions">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!clean">
      {{ editing() ? 'Save changes' : 'Add Debt' }}
    </button>
  </div>
</div>
